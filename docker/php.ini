; Configuration PHP de l'image Cachet
date.timezone = UTC
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 10M
expose_php = Off

; La vérification reCAPTCHA (SubscribeController) fait un file_get_contents
; vers https://www.google.com/recaptcha/api/siteverify
allow_url_fopen = On

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
